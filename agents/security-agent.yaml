name: security-agent
description: Policy compliance, Defender findings, platform image CVEs, certificate and secret expiry, audit → deny
instructions: prompts/security-agent.md
triggers: [schedule-daily, defender-event, key-vault-near-expiry-event]
model: { effort: high, maxTurns: 100 }
tools:
  - design
  - guardrails_read
  - azure_cli
  - azure_resource_graph
  - log_analytics_query
  - kubectl
  - fetch_documentation
  - repo_read: { repositories: [iac, fleet] }
  - repo_write:
      paths:
        iac: ["policy/**"]
        fleet: ["infrastructure/**"]
  - create_pull_request: { repositories: [iac, fleet] }
  - search_issues: { repositories: [iac, fleet] }
  - create_issue: { repositories: [iac, fleet], labels: [security, compliance, application-team, needs-human] }
