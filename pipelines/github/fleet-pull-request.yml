# Fleet repository: .github/workflows/pull-request.yml (GitHub Actions). Renders base and head manifests per
# environment and cluster and uploads them as rendered-manifests for the merge gate.
name: pull-request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install kustomize and kubeconform
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: Render base and head
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered-manifests"
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          bash pipelines/scripts/render-fleet.sh "$RUNNER_TEMP/base" "$out/base"
          bash pipelines/scripts/render-fleet.sh . "$out/head"
          for minor in ${{ vars.K8S_MINORS || '1.36' }}; do
            kubeconform -strict -summary -kubernetes-version "$minor.0" -schema-location default \
              -schema-location "${{ vars.CRD_SCHEMAS }}" "$out/head"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: ${{ runner.temp }}/rendered-manifests
