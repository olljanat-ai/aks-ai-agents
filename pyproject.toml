[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-ai-agents"
version = "0.1.0"
description = "AI agents that operate the AKS platform through pull requests, and the deterministic merge gate that guards them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aks-agent = "aks_agents.cli:main"
aks-gate = "aks_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aks_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
